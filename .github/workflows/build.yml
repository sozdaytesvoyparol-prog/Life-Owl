name: Сборка Life Owl (exe и apk)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    name: Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Установка и сборка
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOwl-windows
          path: |
            desktop/dist/*.exe

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Сборка мобильной страницы
        working-directory: mobile
        run: python build.py
      - name: Capacitor + Android
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          python ../mobile/patch_android.py || python patch_android.py
          npm install --no-save @capacitor/assets@3.0.5
          npx capacitor-assets generate --android || echo "иконки: используется стандартная"
          npx cap sync android
      - name: Сборка apk
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Переименование
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk LifeOwl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOwl-android
          path: LifeOwl.apk
